name: Echo-Memory-Fabricks Deterministic Verification & Boundary Sentinel

on:
  push:
    branches:
      - main
      - 'actuation/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-cold-harness-and-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (SHA-pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22 (SHA-pinned)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup Python 3.12 (SHA-pinned)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run Node test battery & Node<->Python -S cross-runtime byte parity
        run: npm test

      - name: Run standalone Python -S stdlib-only reference self-test
        run: npm run test:python

      - name: Compile & static-audit portable SKILL.md packages
        run: npm run compile:skills

      - name: Verify deterministic Cold-Harness invariants (I1-I4)
        run: npm run cold-harness

      - name: Run One-Way Downstream Publication-Boundary Sentinel
        run: npm run audit:sentinel

      - name: Verify Pre-Existing Background-IP SHA-256 Ledger integrity
        run: node bin/emf.mjs ip-ledger
